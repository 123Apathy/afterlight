<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Afterlight — Logo Suite</title>
    <meta name="hz:slide-selector" content=".logo" />
    <meta name="hz:canvas-width" content="2400" />
    <meta name="hz:canvas-height" content="900" />
    <link rel="stylesheet" href="https://use.typekit.net/dtz8epk.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 40px;
        background: #2b2b2b;
        padding: 40px;
      }
      .logo {
        position: relative;
        display: flex;
        overflow: hidden;
      }
      .wordmark {
        font-family: "source-serif-4", serif;
        font-weight: 600;
        color: #e4b778;
        line-height: 1;
        white-space: nowrap;
      }
      .tagline {
        font-family: "source-sans-3", sans-serif;
        font-weight: 400;
        text-transform: uppercase;
        white-space: nowrap;
      }

      /* Canvas A — dark horizontal lockup */
      .logo--dark-horizontal {
        width: 2400px;
        height: 900px;
        background: #161312;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 90px;
      }
      .logo--dark-horizontal .wordmark {
        font-size: 150px;
      }
      .logo--dark-horizontal .tagline {
        margin-top: 28px;
        font-size: 27px;
        letter-spacing: 9px;
        color: rgba(228, 183, 120, 0.72);
      }
      .logo--dark-horizontal .icon {
        width: 280px;
        height: 280px;
      }

      /* Canvas B — dark stacked lockup (square) */
      .logo--dark-stacked {
        width: 1600px;
        height: 1600px;
        background: #161312;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .logo--dark-stacked .icon {
        width: 340px;
        height: 340px;
      }
      .logo--dark-stacked .wordmark {
        margin-top: 64px;
        font-size: 140px;
      }
      .logo--dark-stacked .tagline {
        margin-top: 34px;
        font-size: 26px;
        letter-spacing: 9px;
        color: rgba(228, 183, 120, 0.72);
      }

      /* Canvas C — light horizontal lockup */
      .logo--light-horizontal {
        width: 2400px;
        height: 900px;
        background: #faf6f0;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 90px;
      }
      .logo--light-horizontal .icon {
        width: 280px;
        height: 280px;
      }
      .logo--light-horizontal .wordmark {
        font-size: 150px;
        color: #1a1613;
      }
      .logo--light-horizontal .tagline {
        margin-top: 28px;
        font-size: 27px;
        letter-spacing: 9px;
        color: rgba(26, 22, 19, 0.5);
      }

      /* Canvas D — icon mark only, transparent */
      .logo--icon-only {
        width: 1024px;
        height: 1024px;
        background: transparent;
        align-items: center;
        justify-content: center;
      }
      .logo--icon-only .icon {
        width: 660px;
        height: 660px;
      }

      .text-col {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      .logo--dark-stacked .text-col,
      .logo--icon-only .text-col {
        align-items: center;
      }
    </style>
  </head>
  <body>
    <!-- A: dark horizontal lockup — website headers, video end-cards, letterhead -->
    <div class="logo logo--dark-horizontal" data-canvas-width="2400" data-canvas-height="900">
      <svg class="icon" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="horizonClipA"><rect x="0" y="64" width="120" height="56" /></clipPath>
        </defs>
        <circle cx="60" cy="50" r="30" fill="none" stroke="#E4B778" stroke-width="2" opacity="0.5" />
        <circle cx="60" cy="50" r="30" fill="#E4B778" clip-path="url(#horizonClipA)" />
        <line x1="10" y1="64" x2="110" y2="64" stroke="#E4B778" stroke-width="2" opacity="0.9" />
      </svg>
      <div class="text-col">
        <div class="wordmark">Afterlight</div>
        <div class="tagline">Memorial Films</div>
      </div>
    </div>

    <!-- B: dark stacked lockup — social avatar, app icon frame -->
    <div class="logo logo--dark-stacked" data-canvas-width="1600" data-canvas-height="1600">
      <svg class="icon" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="horizonClipB"><rect x="0" y="64" width="120" height="56" /></clipPath>
        </defs>
        <circle cx="60" cy="50" r="30" fill="none" stroke="#E4B778" stroke-width="2" opacity="0.5" />
        <circle cx="60" cy="50" r="30" fill="#E4B778" clip-path="url(#horizonClipB)" />
        <line x1="10" y1="64" x2="110" y2="64" stroke="#E4B778" stroke-width="2" opacity="0.9" />
      </svg>
      <div class="text-col">
        <div class="wordmark">Afterlight</div>
        <div class="tagline">Memorial Films</div>
      </div>
    </div>

    <!-- C: light horizontal lockup — print, invoices, light-background use -->
    <div class="logo logo--light-horizontal" data-canvas-width="2400" data-canvas-height="900">
      <svg class="icon" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="horizonClipC"><rect x="0" y="64" width="120" height="56" /></clipPath>
        </defs>
        <circle cx="60" cy="50" r="30" fill="none" stroke="#E4B778" stroke-width="2" opacity="0.5" />
        <circle cx="60" cy="50" r="30" fill="#E4B778" clip-path="url(#horizonClipC)" />
        <line x1="10" y1="64" x2="110" y2="64" stroke="#E4B778" stroke-width="2" opacity="0.9" />
      </svg>
      <div class="text-col">
        <div class="wordmark">Afterlight</div>
        <div class="tagline">Memorial Films</div>
      </div>
    </div>

    <!-- D: icon-only mark — favicon, app icon, watermark -->
    <div class="logo logo--icon-only" data-canvas-width="1024" data-canvas-height="1024">
      <svg class="icon" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="horizonClipD"><rect x="0" y="64" width="120" height="56" /></clipPath>
        </defs>
        <circle cx="60" cy="50" r="30" fill="none" stroke="#E4B778" stroke-width="2" opacity="0.5" />
        <circle cx="60" cy="50" r="30" fill="#E4B778" clip-path="url(#horizonClipD)" />
        <line x1="10" y1="64" x2="110" y2="64" stroke="#E4B778" stroke-width="2" opacity="0.9" />
      </svg>
    </div>
  </body>
</html>
