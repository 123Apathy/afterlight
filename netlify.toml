[build]
  command = "npx expo export --platform web"
  publish = "dist"
  # Kill switch for git-triggered builds: the ignore command exiting 0 makes
  # Netlify skip the build, so a push can never burn build credits. Deploys
  # happen ONLY via the CLI (Deploy Everlit.cmd), which ignores this setting.
  # To ever re-enable git builds, delete this line.
  ignore = "exit 0"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# /join/:code and /admin/:secret read the built index.html to inject meta
# tags / render the dashboard — bundle dist/ into the function so that works.
[functions.api]
  included_files = ["dist/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200

[[redirects]]
  from = "/join/*"
  to = "/.netlify/functions/api/join/:splat"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/.netlify/functions/api/admin/:splat"
  status = 200

# The root `/` is the static marketing/home page; the SPA app lives at /app.
# Must come before the SPA fallback below so `/` doesn't resolve to the app.
# force=true is required: dist/index.html (the Expo app shell) exists at this
# exact path, and Netlify's default is "existing files win over redirects" --
# without force, this rule silently never fires and `/` serves the bare app
# shell instead of the landing page. Confirmed live: production's current
# deploy (commit a4b7522, today) built and published cleanly, but everlit.co.za
# was still serving a 1.2KB generic-titled page with none of the landing
# content, for exactly this reason.
[[redirects]]
  from = "/"
  to = "/landing.html"
  status = 200
  force = true

# Extensionless /terms and /privacy serve the static legal pages. Placed before
# the SPA fallback; force not needed because no file exists at either literal
# path. Without these the SPA fallback swallows them and serves the app shell.
[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

# SPA fallback: anything else that isn't a static asset resolves client-side.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
