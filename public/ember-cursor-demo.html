<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ember cursor — prototype</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0908; overflow: hidden; }
  canvas { position: fixed; inset: 0; }
  .note {
    position: fixed; top: 24px; left: 24px; z-index: 2;
    font-family: 'Poppins', sans-serif; color: rgba(245,240,235,0.55);
    font-size: 13px; max-width: 360px; line-height: 1.5;
  }
  .note b { color: rgba(245,240,235,0.85); }
</style>
</head>
<body>
  <div class="note">
    Prototype only — not wired into the real page.<br/>
    Move your mouse around. <b>4–8 embers</b>, spring physics, soft warm glow, no hard lines.<br/>
    Auto-disables under reduced-motion or on touch devices.
  </div>
  <canvas id="c"></canvas>
  <script>
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const touch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

    if (!reduced && !touch) {
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      let W, H;
      function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
      resize();
      window.addEventListener('resize', resize);

      const COLORS = ['#D4A976', '#C49A6C', '#F5F0EB'];
      const COUNT = 6;
      const SPRING = 0.02;   // how strongly a particle is pulled toward its target -- low = heavy, slow drift
      const FRICTION = 0.88; // velocity decay per frame -- high friction = settles quickly, no overshoot bounce

      const mouse = { x: W / 2, y: H / 2 };
      let hasMoved = false;
      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        hasMoved = true;
      });

      // Each ember chases the one before it (chain), first ember chases the cursor.
      // Spring + friction (not direct lerp) is what gives the lazy, elastic settle
      // instead of a snappy 1:1 follow.
      const embers = Array.from({ length: COUNT }, (_, i) => ({
        x: W / 2, y: H / 2, vx: 0, vy: 0,
        size: 18 - i * 2,
        color: COLORS[i % COLORS.length],
        drift: Math.random() * Math.PI * 2,
      }));

      function tick(t) {
        ctx.clearRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'lighter';

        let targetX = mouse.x, targetY = mouse.y;
        embers.forEach((e, i) => {
          // gentle upward drift + tiny sideways wander so embers feel alive even at rest
          const wanderX = Math.sin(t / 1400 + e.drift) * 6;
          const wanderY = -((t / 40) % 60) * 0.15;

          const dx = (targetX + wanderX) - e.x;
          const dy = (targetY + wanderY) - e.y;
          e.vx = (e.vx + dx * SPRING) * FRICTION;
          e.vy = (e.vy + dy * SPRING) * FRICTION;
          e.x += e.vx;
          e.y += e.vy;

          targetX = e.x;
          targetY = e.y;

          if (!hasMoved) return;
          const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.size);
          g.addColorStop(0, e.color + 'aa');
          g.addColorStop(1, e.color + '00');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
          ctx.fill();
        });

        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }
  </script>
</body>
</html>
